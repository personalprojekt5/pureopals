<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ececec">
<meta name="robots" content="noindex">
<title>OFFLINE — Logged off</title>
<meta name="description" content="Drop 01 is logged off. Enter the password to log back on.">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,301,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/pages.css">
</head>
<body class="pw-page">
<header class="top">
  <span class="status status--time cap" id="clock" aria-hidden="true">06:00</span>
  <span class="status status--signal cap" aria-hidden="true"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="status__txt">No service</span></span>
  <span class="logo" aria-label="OFFLINE">Offline<i>®</i></span>
  <span class="status status--battery cap" aria-hidden="true"><span class="batt"><i></i></span>12%</span>
</header>
<main class="pw">
  <div class="pw__box">
    <p class="cap">Drop 01 · Password</p>
    <h1 class="pw__title">Gone <i>offline.</i></h1>
    <p class="pw__sub">The store is logged off for now. Got the password? Log back on.</p>
    <form class="pw__form" id="pwform" novalidate>
      <label class="pw__label cap" for="pw">Password</label>
      <div class="pw__row">
        <input class="pw__input" id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required placeholder="Password">
        <button class="pw__go" type="submit" aria-label="Enter"><svg width="22" height="12" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h24M19 1l6 6-6 6"/></svg></button>
      </div>
      <p class="pw__msg cap" id="pwmsg" role="alert" aria-live="assertive"></p>
    </form>
  </div>
  <div class="pw__line" id="pwline" aria-hidden="true"></div>
</main>
<script type="module" src="/src/password.ts"></script>
</body>
</html>
