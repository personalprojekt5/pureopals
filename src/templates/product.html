<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ececec">
<title>{{name}} — OFFLINE</title>
<meta name="description" content="{{name}}, {{price}}. {{kind}} from Look {{look}} — {{lookName}}, Drop 01.">
<meta property="og:title" content="{{name}} — OFFLINE">
<meta property="og:image" content="{{img}}">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,301,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/pages.css">
</head>
<body class="pg" data-slug="{{slug}}">
<header class="top">
  <span class="status status--time cap" id="clock" aria-hidden="true">06:00</span>
  <span class="status status--signal cap" aria-hidden="true"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="status__txt">No service</span></span>
  <a class="logo" href="../../" aria-label="OFFLINE home">Offline<i>®</i></a>
  <span class="status status--battery cap" aria-hidden="true"><span class="batt"><i></i></span>12%</span>
  <button class="bagbtn pill" type="button" aria-label="Bag">Bag (<span class="count" data-count>0</span>)</button>
</header>
<main class="pd">
  <div class="pd__top">
  <div class="pd__stage" id="pdstage">
    <div class="pd__model" id="pdmodel"></div>
  </div>
  <section class="pd__info" aria-labelledby="pdname">
    <div class="pd__sheet">
      <nav class="crumbs cap" aria-label="Breadcrumb"><a href="../../shop.html">Shop all</a><span aria-hidden="true">/</span><a href="../../shop.html" id="pdkind">{{kind}}</a></nav>
      <div class="pd__shot"><img src="{{img}}" alt="" width="192" height="192" decoding="async"></div>
      <p class="cap pd__kick">Look {{look}} — {{lookName}} · Piece {{piece}}</p>
      <h1 class="pd__name" id="pdname">{{name}}</h1>
      <p class="pd__price" id="pdprice">{{price}}</p>
      <div class="pd__buy" id="pdbuy" hidden>
        <div class="pd__sizes-head"><span class="cap">Size</span><span class="cap pd__muted" id="pdsizehint"></span></div>
        <div class="rw__sizes" role="group" aria-label="Size" id="pdsizes"></div>
        <p class="rw__msg" id="pdmsg" role="status" aria-live="polite"></p>
        <button class="rw__cta" id="pdadd" type="button"><span>Add to bag</span><svg width="22" height="12" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h24M19 1l6 6-6 6"/></svg></button>
      </div>
      <div class="pd__look" id="pdlook"></div>
      <nav class="pd__help cap" aria-label="Help"><a href="../../faq.html#shipping">Shipping</a><a href="../../faq.html#returns">Returns</a><a href="../../faq.html#sizing">Size chart</a><a href="../../faq.html#care">Care</a></nav>
    </div>
  </section>
  </div>
  <section class="pd__more" aria-labelledby="pdmore">
    <h2 class="pd__more-title" id="pdmore">More <i id="pdmorekind">{{kind}}</i></h2>
    <ul class="shop__grid" id="pdgrid" role="list"></ul>
    <nav class="pd__pager" id="pdpager" aria-label="Other pieces"></nav>
    <footer class="pg__foot">
      <nav class="pg__nav" aria-label="Site"><a class="pill" href="../../">The ring</a><a class="pill" href="../../shop.html">Shop all</a><a class="pill" href="../../journal.html">Journal</a><a class="pill" href="../../faq.html">FAQ</a></nav>
      <span class="cap">Thank you for logging off</span>
    </footer>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/product.ts"></script>
</body>
</html>
