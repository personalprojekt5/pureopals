<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ececec">
<title>Shop all — OFFLINE</title>
<meta name="description" content="Drop 01: every piece from the nine looks. Tops, outerwear, bottoms, shoes and accessories for logging off.">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,301,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/pages.css">
</head>
<body class="pg">
<header class="top">
  <span class="status status--time cap" id="clock" aria-hidden="true">06:00</span>
  <span class="status status--signal cap" aria-hidden="true"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="status__txt">No service</span></span>
  <a class="logo" href="./" aria-label="OFFLINE home">Offline<i>®</i></a>
  <span class="status status--battery cap" aria-hidden="true"><span class="batt"><i></i></span>12%</span>
  <button class="bagbtn pill" type="button" aria-label="Bag">Bag (<span class="count" data-count>0</span>)</button>
</header>
<main class="shop">
  <div class="shop__head">
    <nav class="crumbs cap" aria-label="Breadcrumb"><a href="./">Drop 01</a><span aria-hidden="true">/</span><span aria-current="page">Shop all</span></nav>
    <h1 class="shop__title">All <i>pieces.</i></h1>
    <p class="shop__sub cap" id="shopcount">27 pieces · 9 looks</p>
  </div>
  <div class="shop__filters" role="group" aria-label="Filter by type" id="filters"></div>
  <ul class="shop__grid" id="grid" role="list"></ul>
  <footer class="pg__foot">
    <a class="pill" href="./">Back to the ring</a>
    <span class="cap">Thank you for logging off</span>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/shop.ts"></script>
</body>
</html>
